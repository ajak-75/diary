<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다이어리</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="일상과 생각을 가볍게 나누는 공간. 짧은 글과 사진으로 오늘을 기록하고, 서로의 하루에 답글을 남겨 보세요.">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다이어리">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta property="og:type" content="website">
<meta property="og:site_name" content="다이어리">
<meta property="og:title" content="다이어리">
<meta property="og:description" content="일상과 생각을 가볍게 나누는 공간. 짧은 글과 사진으로 오늘을 기록하고, 서로의 하루에 답글을 남겨 보세요.">
<meta property="og:image" content="https://ajak-75.github.io/diary/icons/og-cover.jpg">
<meta property="og:url" content="https://ajak-75.github.io/diary/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="다이어리">
<meta name="twitter:description" content="일상과 생각을 가볍게 나누는 공간.">
<meta name="twitter:image" content="https://ajak-75.github.io/diary/icons/og-cover.jpg">

<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar" id="topbar">
    <a class="brand" href="./" aria-label="다이어리 홈">
      <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4.5h13.5L26 10v17.5H7z"/>
        <path d="M20 4.5V10h5.5"/>
        <path d="M11 15h11M11 19.5h11M11 24h6.5"/>
      </svg>
      <span class="brand-copy">
        <span class="brand-title">다이어리</span>
        <span class="brand-sub">일상과 생각을 가볍게 나누는 공간</span>
      </span>
    </a>
  </header>

  <main class="main" id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="주요 메뉴">
    <button class="tab" type="button" data-view="home">
      <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="tab-label">홈</span>
    </button>
    <button class="tab" type="button" data-view="search">
      <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
      <span class="tab-label">검색</span>
    </button>
    <button class="tab tab-create" type="button" id="composeBtn" aria-label="새 글 쓰기">
      <span class="create-fab">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
      </span>
      <span class="tab-label">글쓰기</span>
    </button>
    <button class="tab" type="button" data-view="me">
      <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20.2c.9-3.6 3.7-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg>
      <span class="tab-label">내 프로필</span>
    </button>
  </nav>

</div>

<!-- 글쓰기 / 수정 -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="composeSheet" role="dialog" aria-modal="true" aria-labelledby="composeTitle" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <header class="sheet-head">
    <button class="text-btn" type="button" id="composeCancel">취소</button>
    <h2 class="sheet-title" id="composeTitle">새 글</h2>
    <button class="pill primary" type="button" id="composeSubmit">게시</button>
  </header>
  <div class="sheet-body">
    <div class="warn" id="composeWarn" role="alert" hidden></div>
    <div class="compose-row">
      <img class="avatar avatar-40" id="composeAvatar" src="./icons/avatar-default.svg" alt="" width="40" height="40">
      <div class="compose-fields">
        <textarea id="bodyInput" class="body-input" rows="6" maxlength="500" placeholder="오늘 어떤 하루였나요?" aria-label="글 내용"></textarea>
        <div class="compose-under">
          <input id="tagInput" class="tag-input" type="text" maxlength="80" placeholder="#일상 #오늘" aria-label="태그">
          <span class="counter"><span id="bodyCount">0</span>/500</span>
        </div>
      </div>
    </div>
    <div class="photo-strip" id="photoStrip" hidden></div>
    <div class="compose-tools">
      <button class="tool-btn" type="button" id="photoBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="m4 17 4.5-4.5 4 4L16 12l4 4"/></svg>
        <span>사진·영상</span>
      </button>
      <span class="tool-hint" id="photoHint">사진·영상 4개까지 (영상 15초·15MB 이내)</span>
      <input id="mediaInput" type="file" accept="image/*,video/*" multiple hidden>
    </div>
    <p class="hint" id="composeHint">글은 이 기기에 저장돼요.</p>
  </div>
</section>

<!-- 내 프로필 편집 -->
<section class="sheet sheet-profile" id="profileSheet" role="dialog" aria-modal="true" aria-labelledby="profileTitle" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <header class="sheet-head">
    <button class="text-btn" type="button" id="profileCancel">취소</button>
    <h2 class="sheet-title" id="profileTitle">프로필 편집</h2>
    <button class="pill primary" type="button" id="profileSave">저장</button>
  </header>
  <div class="sheet-body">
    <div class="warn" id="profileWarn" role="alert" hidden></div>
    <div class="profile-photo-row">
      <button class="profile-photo-btn" type="button" id="profilePhotoBtn" aria-label="프로필 사진">
        <img class="profile-photo-img" id="profilePhotoImg" src="./icons/avatar-default.svg" alt="" width="88" height="88">
        <span class="profile-photo-cam" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h3l1.4-2h7.2l1.4 2h3v10.5H4z"/><circle cx="12" cy="13" r="3.1"/></svg>
        </span>
      </button>
      <div class="profile-photo-tools">
        <button class="tool-btn" type="button" id="profilePhotoPick">사진 선택</button>
        <button class="text-btn profile-photo-reset" type="button" id="profilePhotoReset">기본 이미지로 되돌리기</button>
      </div>
      <input id="profilePhotoInput" type="file" accept="image/*" hidden>
    </div>
    <label class="field" for="profileNickInput">
      <span class="field-label">닉네임</span>
      <input class="field-input" id="profileNickInput" type="text" maxlength="20" autocomplete="nickname" autocapitalize="off" placeholder="20자까지 쓸 수 있어요">
      <span class="field-note"><span id="profileNickCount">0</span>/20</span>
    </label>
    <label class="field" for="profileBioInput">
      <span class="field-label">한 줄 소개</span>
      <textarea class="field-input field-area profile-area" id="profileBioInput" rows="2" maxlength="80" placeholder="나를 소개하는 한 줄, 80자까지"></textarea>
      <span class="field-note"><span id="profileBioCount">0</span>/80</span>
    </label>
    <p class="hint">사진·닉네임·소개는 내 글과 댓글에 함께 보여요. 이 기기에 저장돼요.</p>
  </div>
</section>

<!-- 커뮤니티 약속 -->
<section class="sheet sheet-promise" id="promiseSheet" role="dialog" aria-modal="true" aria-labelledby="promiseSheetTitle" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <header class="sheet-head">
    <span class="sheet-pad" aria-hidden="true"></span>
    <h2 class="sheet-title" id="promiseSheetTitle">📜 커뮤니티 약속</h2>
    <button class="text-btn" type="button" id="promiseClose">닫기</button>
  </header>
  <div class="sheet-body">
    <p class="promise-lead">누구나 편하게 머무는 공간을 위한 다섯 가지 약속이에요.</p>
    <ol class="promise-list" id="promiseList"></ol>
    <p class="promise-foot">약속을 어긴 글은 경고 안내 뒤에 게시되지 않아요.</p>
  </div>
</section>

<!-- 사진 보기 -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="사진" hidden>
  <button class="viewer-close" type="button" id="viewerClose" aria-label="닫기">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <img id="viewerImg" alt="">
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./app.js"></script>
</body>
</html>
